org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Local HTTP proxy (the sandbox reaches the internet only through this;
# without it Gradle hangs resolving google()/mavenCentral()).
# Disabled 2026-09-08: proxy client (127.0.0.1:10808) is not running,
# direct internet access works. Uncomment if the proxy is needed again.
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=10808
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10808
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Third-party plugins (pedometer 4.2.0 and others) still apply the
# kotlin-android plugin, which AGP 9 built-in Kotlin mode rejects.
android.builtInKotlin=false
# Project path contains non-ASCII characters (D:\Удалять запрещено\ataraxy);
# required or Android Gradle Plugin refuses to build on Windows.
android.overridePathCheck=true
